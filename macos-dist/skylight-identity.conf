# Skylight identity — single source of truth for bundle ids, launchd labels,
# the XPC service name, and the code-signing identity.
#
# Fresh installs use these defaults. A machine that needs different values
# (e.g. this project's original install, which predates the io.github.*
# rename and keeps its TCC grants keyed to the legacy identity) creates a
# gitignored `skylight-identity.local.conf` next to this file overriding any
# subset of the variables. Every build script sources both, local last.
#
# XPC peer requirements are generated by generate-identity.sh. Local mode pins
# a self-signed certificate; release mode pins Apple plus the Developer ID Team ID.

SKYLIGHT_BUNDLE_ID="io.github.joaodriessen.skylight"
SKYLIGHT_MENU_BUNDLE_ID="io.github.joaodriessen.skylight.menu"
SKYLIGHT_HOST_BUNDLE_ID="io.github.joaodriessen.skylight.host"
SKYLIGHT_DAEMON_LABEL="io.github.joaodriessen.skylight.daemon"
SKYLIGHT_GHOSTWATCH_LABEL="io.github.joaodriessen.skylight.ghostwatch"
SKYLIGHT_XPC_SERVICE="io.github.joaodriessen.skylight.xpc"
SKYLIGHT_SIGNING_IDENTITY="Skylight Local Signing"
SKYLIGHT_HOST_EXECUTABLE_RELATIVE_PATH="Contents/Resources/Helpers/Skylight"
SKYLIGHT_LAUNCH_AGENT_PLIST_NAME="io.github.joaodriessen.skylight.daemon.plist"

# Alpha-track version string, surfaced by `sunshine --version`/startup log and the
# menu app's Info.plist CFBundleShortVersionString. Bump by hand per release; not
# derived from git describe (this fork doesn't tag).
SKYLIGHT_VERSION="0.4.0-alpha.16"
