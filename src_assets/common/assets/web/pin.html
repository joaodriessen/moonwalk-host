<!DOCTYPE html>
<html lang="en" data-bs-theme="auto">

<head>
  <%- header %>
</head>

<body id="app" v-cloak>
  <Navbar></Navbar>
  <div id="content" class="container">
    <h1 class="my-4 text-center">{{ $t('pin.pin_pairing') }}</h1>
    <form class="form d-flex flex-column align-items-center" id="form" @submit.prevent="registerDevice">
      <div class="card flex-column d-flex p-4 mb-4">
        <div class="input-group mt-2">
          <span class="input-group-text">
            <hash :size="18" class="icon"></hash>
          </span>
          <input type="text" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" v-model="pin" :placeholder="`${$t('navbar.pin')}`" autofocus id="pin-input" class="form-control" required />
        </div>
        <div class="input-group my-4">
          <span class="input-group-text">
            <monitor :size="18" class="icon"></monitor>
          </span>
          <input type="text" v-model="name" :placeholder="`${$t('pin.device_name')}`" id="name-input" class="form-control" required />
        </div>

        <!-- Always let the owner select the device by its network address. -->
        <div class="pending-pairings my-2">
          <div class="mb-2"><small class="text-muted">{{ pendingHelpText }}</small></div>

          <div v-if="pending.length === 0" class="text-muted small d-flex align-items-center gap-2">
            <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
            <span>Waiting for a device to start pairing…</span>
          </div>

          <div v-else class="list-group">
            <button
              v-for="p in pending"
              :key="p.uniqueid"
              type="button"
              class="list-group-item list-group-item-action d-flex justify-content-between align-items-center"
              :class="{ active: selectedTarget === p.uniqueid }"
              :aria-pressed="selectedTarget === p.uniqueid"
              :disabled="sending"
              @click="selectedTarget = p.uniqueid"
            >
              <span class="font-monospace">{{ p.source_ip }}</span>
              <span class="badge bg-secondary rounded-pill">{{ ageLabel(p.age_sec) }}</span>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary mt-2" :disabled="!selectedTarget || sending">
          <forward :size="18" class="icon"></forward>
          {{ $t('pin.send') }}
        </button>
      </div>
      <div class="alert alert-warning">
        <b>{{ $t('_common.warning') }}</b> {{ $t('pin.warning_msg') }}
      </div>
      <div v-if="notice" class="alert" :class="notice === 'pin_sent' ? 'alert-info' : 'alert-danger'" role="alert">
        {{ $t('pin.' + notice) }}
      </div>
    </form>
  </div>
</body>

<script type="module">
  import { createApp } from 'vue'
  import { initApp } from './init'
  import Navbar from './Navbar.vue'
  import {
    Forward,
    Hash,
    Monitor,
  } from '@lucide/vue'

  let app = createApp({
    components: {
      Navbar,
      Forward,
      Hash,
      Monitor,
    },
    data() {
      return {
        pending: [],
        selectedTarget: '',
        pin: '',
        name: '',
        sending: false,
        notice: '',
        pendingPollHandle: null,
      };
    },
    computed: {
      pendingHelpText() {
        return this.pending.length === 0
          ? 'Start pairing on your device — its network address will appear here for you to confirm.'
          : 'Tap the row for your device, identified by its network address. This confirmation is required even if only one device is shown.';
      },
    },
    methods: {
      ageLabel(ageSec) {
        return ageSec < 60 ? `${ageSec}s ago` : `${Math.floor(ageSec / 60)}m ago`;
      },
      refreshPending() {
        fetch('./api/pending-pairings')
          .then((response) => response.json())
          .then((response) => {
            this.pending = (response && response.pending) || [];
            // Clear a selection that vanished (paired by someone else, expired, or evicted)
            // rather than silently submitting a dead target.
            if (this.selectedTarget && !this.pending.some((p) => p.uniqueid === this.selectedTarget)) {
              this.selectedTarget = '';
            }
          })
          .catch(() => {
            // Authenticated-localhost endpoint; a transient failure just leaves the list as-is
            // and tries again on the next poll tick -- no need to surface this as a page error.
          });
      },
      async registerDevice() {
        if (!this.selectedTarget || this.sending) return;
        this.sending = true;
        this.notice = '';
        try {
          const response = await fetch('./api/pin', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({pin: this.pin, name: this.name, uniqueid: this.selectedTarget}),
          });
          if (response.ok && (await response.json()).status === true) {
            this.notice = 'pin_sent';
            this.pin = '';
            this.name = '';
            this.selectedTarget = '';
          } else {
            this.notice = 'pin_rejected';
          }
        } catch {
          this.notice = 'pin_unconfirmed';
        } finally {
          this.sending = false;
        }
      }
    },
    mounted() {
      this.refreshPending();
      this.pendingPollHandle = setInterval(this.refreshPending, 2000);
    },
    beforeUnmount() {
      if (this.pendingPollHandle) {
        clearInterval(this.pendingPollHandle);
      }
    },
  });

  initApp(app);
</script>
