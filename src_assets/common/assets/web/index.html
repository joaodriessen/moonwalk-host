<!DOCTYPE html>
<html lang="en" data-bs-theme="auto">

<head>
  <%- header %>
</head>

<body id="app" v-cloak>
  <Navbar></Navbar>
  <div id="content" class="container">
    <h1 class="my-4">Moonwalk Host</h1>
    <p>Manage the streaming host on this Mac. You can also open Settings from its menu bar icon.</p>

    <!-- Fatal Errors Alert -->
    <div class="alert alert-danger my-4" v-if="fancyLogs.find(x => x.level === 'Fatal')">
      <div>
        <div class="d-flex align-items-center mb-3">
          <alert-circle :size="32" class="icon-lg me-3"></alert-circle>
          <div v-html="$t('index.startup_errors')"></div>
        </div>
        <ul class="mb-3">
          <li v-for="v in fancyLogs.filter(x => x.level === 'Fatal')">{{v.value}}</li>
        </ul>
        <a class="btn btn-danger" href="./troubleshooting#logs">
          <file-text :size="18" class="icon"></file-text>
          View Logs
        </a>
      </div>
    </div>

    <div v-if="version" class="card my-4">
      <div class="card-body">
        <h2>Installed version</h2>
        <p>Moonwalk Host {{ version }}</p>
        <a class="btn btn-secondary" href="https://github.com/joaodriessen/moonwalk-host/releases"
           target="_blank" rel="noopener noreferrer">View releases</a>
      </div>
    </div>

    <div class="my-4">
      <ResourceCard :source-revision="sourceRevision"></ResourceCard>
    </div>
  </div>
</body>

<script type="module">
  import { createApp } from 'vue'
  import { initApp } from './init'
  import Navbar from './Navbar.vue'
  import ResourceCard from './ResourceCard.vue'
  import { AlertCircle, FileText } from 'lucide-vue-next'

  const app = createApp({
    components: { Navbar, ResourceCard, AlertCircle, FileText },
    data() {
      return { version: '', sourceRevision: '', logs: '' }
    },
    async created() {
      try {
        const response = await fetch('./api/config')
        if (response.ok) {
          const config = await response.json()
          this.version = config.host_version
          this.sourceRevision = config.source_revision
        }
      } catch (error) {
        console.error('Could not read the host version', error)
      }
      try {
        const response = await fetch('./api/logs')
        if (response.ok) this.logs = await response.text()
      } catch (error) {
        console.error('Could not read the host log', error)
      }
    },
    computed: {
      fancyLogs() {
        const lines = this.logs.split(/\[\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d{3}\]:\s/)
        return lines.slice(1).map(line => ({ level: line.split(':', 1)[0], value: line }))
      }
    }
  })

  initApp(app)
</script>
</html>
