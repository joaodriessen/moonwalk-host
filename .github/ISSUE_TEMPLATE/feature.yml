name: Feature request
description: Suggest an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: "What would you like to do?"
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes: {label: "What would help?"}
    validations: {required: true}
  - type: textarea
    id: alternatives
    attributes: {label: "What happens today?"}
