name: Report a bug
description: Report a problem someone else can try to reproduce.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "For suspected security vulnerabilities, follow [Security](https://github.com/joaodriessen/moonwalk-host/blob/main/SECURITY.md). Do not post credentials or vulnerability details in an ordinary issue."
  - type: input
    id: version
    attributes: {label: Moonwalk Host version, description: Open Settings → Status → About Moonwalk Host.}
    validations: {required: true}
  - type: input
    id: system
    attributes: {label: "Mac model, macOS version, and client app/version"}
    validations: {required: true}
  - type: textarea
    id: steps
    attributes:
      label: How can we reproduce it?
      description: Include the client and whether the Mac was sharing a physical or virtual display if it affects the problem.
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: "What happened, and what did you expect?"}
    validations: {required: true}
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics or screenshots
      description: Use Save Diagnostics in Settings → Status → Support. Review the ZIP and remove private details before attaching it.
